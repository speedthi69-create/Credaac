<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Credaac - Soluções Financeiras e Microcrédito</title>
    <meta name="description" content="A Credaac oferece crédito de verdade para quem mais precisa. Processo 100% online, sem burocracia e com respeito." />
    <meta name="keywords" content="microcrédito, empréstimo, crédito para motoristas, empréstimo online, credaac, financiamento" />
    <link rel="canonical" href="https://www.credaac.com.br" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.credaac.com.br/" />
    <meta property="og:title" content="Credaac - Soluções Financeiras e Microcrédito" />
    <meta property="og:description" content="Crédito de verdade para quem mais precisa. Processo 100% online e transparente." />
    <meta property="og:image" content="/credaac_favicon.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Credaac - Soluções Financeiras" />
    <meta property="twitter:description" content="Crédito de verdade para quem mais precisa. Processo 100% online e transparente." />
    <meta property="twitter:image" content="/credaac_favicon.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/credaac_favicon.jpg" />
    
    <!-- DNS Prefetching & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.imgur.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://i.imgur.com" />

    <!-- Data Layer / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "Credaac Soluções Financeiras",
      "description": "Microcrédito online rápido e seguro.",
      "url": "https://www.credaac.com.br",
      "telephone": "+5511999999999",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BR"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
